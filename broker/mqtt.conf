# MQTT Broker Configuration (EMQX)

## Основні порти:
# 1883  - TCP незашифрований MQTT
# 8883  - TLS/SSL MQTT
# 8083  - WebSocket
# 8084  - WebSocket Secure (WSS)
# 18083 - Дашбоард управління (http://localhost:18083)

## Облікові дані за замовчуванням:
# Username: admin
# Password: public

## Налаштування:
# EMQX_ALLOW_ANONYMOUS: true - дозволяє анонімні підключення
# EMQX_NODE_NAME: emqx@127.0.0.1 - ім'я вузла
# EMQX_LISTENERS_TCP_DEFAULT_ACCEPTORS: 16384 - максимальна кількість підключень
